name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          "numpy>=1.26,<2.0" "pandas>=2.0,<3.0" "streamlit>=1.50,<2.0"
          "psutil>=5.9,<7.0" "joblib>=1.3,<2.0"
          "scikit-learn>=1.4,<2.0" "xgboost>=2.0,<3.1" "pytest>=8.0,<9.0"
      - name: Check Python syntax
        run: python -m py_compile app.py train_model.py prepare_inference_csv.py tests/test_pipeline.py
      - name: Run tests
        run: python -m pytest -q
