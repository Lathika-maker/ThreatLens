name: Python syntax and fatal-name check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight checker
        run: python -m pip install --disable-pip-version-check flake8

      - name: Compile required Python files
        run: python -m py_compile app.py train_model.py

      - name: Check syntax and fatal undefined names
        run: flake8 --select=E9,F63,F7,F82 app.py train_model.py
